name: Build and publish Chinese portable release

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'requirements.txt'
      - 'README.md'
      - 'RELEASE-NOTES.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chinese-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Download and verify the original 1.1.0 portable archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path work | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/Cengokill/CompositorWindows/releases/download/v1.1.0/CompositorWindows-1.1.0-portable.zip' -OutFile work/original.zip
          $digest = (Get-FileHash -LiteralPath work/original.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne '5d9d7bf47d9f843e4031b401927f935a9817e91506cd3393ad7f8fbd5a9bec39') { throw 'Original download hash mismatch' }
          Expand-Archive -LiteralPath work/original.zip -DestinationPath work/original
      - name: Reproduce the Chinese binaries
        run: python tools/build.py --input work/original/CompositorWindows --output work/CompositorWindows-zh-CN
      - name: Verify reproduced binaries and create release archives
        run: python tools/package_release.py --portable work/CompositorWindows-zh-CN --output release-assets
      - name: Check bundled model and codecs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path -LiteralPath work/CompositorWindows-zh-CN/Compositor.exe).Path
          $check = Start-Process -FilePath $exe -ArgumentList '--update-health-check' -WorkingDirectory (Split-Path -Parent $exe) -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw "Health check failed: $($check.ExitCode)" }
      - name: Publish the release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v1.1.0-zh.1'
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output 'This release already exists; existing assets will not be overwritten.'
            exit 0
          }
          gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'CompositorWindows 1.1.0 简体中文界面 · zh.1' --notes-file RELEASE-NOTES.md release-assets/CompositorWindows-1.1.0-zh-CN-portable.zip release-assets/CompositorWindows-1.1.0-zh-CN-localization-source.zip release-assets/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
